name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Repository Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck API
        run: npm run typecheck --workspace=@hms/api

      - name: Typecheck Web
        run: npm run typecheck --workspace=@hms/web

      - name: Typecheck Patient Web
        run: npm run typecheck --workspace=@hms/patient-web

      - name: Lint API
        run: npm run lint --workspace=@hms/api
        continue-on-error: true

      - name: Lint Web
        run: npm run lint --workspace=@hms/web

      - name: Lint Patient Web
        run: npm run lint --workspace=@hms/patient-web

      - name: Build API
        run: npm run build --workspace=@hms/api

      - name: Build Web
        run: npm run build --workspace=@hms/web

      - name: Build Patient Web
        run: npm run build --workspace=@hms/patient-web

      - name: Security & Core Suite Tests
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/hms_test
        run: npm run test:security
