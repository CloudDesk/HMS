steps:
  - id: set-project
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - config
      - set
      - project
      - ${_PROJECT_ID}

  - id: enable-cloud-run-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - services
      - enable
      - run.googleapis.com
      - --project
      - ${_PROJECT_ID}

  - id: build-api-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.api
      - -t
      - gcr.io/h-m-s-505410/hms-api-sit:$SHORT_SHA
      - .

  - id: push-api-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/h-m-s-505410/hms-api-sit:$SHORT_SHA

  - id: prepare-sit-env
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        awk '
          /^[[:space:]]*#/ || /^[[:space:]]*$/ { next }
          $0 !~ /^PORT=/ { print }
        ' apps/api/.env.dev > /workspace/apps/api/.env.cloudrun.sit

  - id: deploy-api-sit
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - gcr.io/h-m-s-505410/hms-api-sit:$SHORT_SHA
      - --project
      - ${_PROJECT_ID}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --execution-environment
      - gen2
      - --memory
      - ${_MEMORY}
      - --cpu
      - ${_CPU}
      - --min-instances
      - ${_MIN_INSTANCES}
      - --max-instances
      - ${_MAX_INSTANCES}
      - --concurrency
      - ${_CONCURRENCY}
      - --timeout
      - ${_TIMEOUT}
      - --port
      - "8080"
      - --env-vars-file
      - /workspace/apps/api/.env.cloudrun.sit

images:
  - gcr.io/h-m-s-505410/hms-api-sit:$SHORT_SHA

substitutions:
  _PROJECT_ID: h-m-s-505410
  _REGION: asia-south1
  _SERVICE_NAME: hms-api-sit
  _MEMORY: 512Mi
  _CPU: "1"
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "3"
  _CONCURRENCY: "80"
  _TIMEOUT: 300s

options:
  logging: CLOUD_LOGGING_ONLY
