steps:
  - id: set-project
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - config
      - set
      - project
      - ${_PROJECT_ID}

  - id: enable-cloud-run-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - services
      - enable
      - run.googleapis.com
      - --project
      - ${_PROJECT_ID}

  - id: build-api-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.api
      - -t
      - gcr.io/h-m-s-505410/hms-api-sit:$SHORT_SHA
      - .

  - id: push-api-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/h-m-s-505410/hms-api-sit:$SHORT_SHA

  - id: prepare-sit-env
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        python3 - <<'PY'
        import json
        from pathlib import Path

        source = Path("apps/api/.env.dev")
        target = Path("/workspace/apps/api/.env.cloudrun.sit.yaml")

        with target.open("w", encoding="utf-8") as output:
            for raw_line in source.read_text(encoding="utf-8").splitlines():
                line = raw_line.strip()
                if not line or line.startswith("#") or "=" not in line:
                    continue

                key, value = line.split("=", 1)
                key = key.strip()
                if key == "PORT":
                    continue

                output.write(f"{key}: {json.dumps(value)}\n")
        PY

  - id: deploy-api-sit
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - gcr.io/h-m-s-505410/hms-api-sit:$SHORT_SHA
      - --project
      - ${_PROJECT_ID}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --execution-environment
      - gen2
      - --memory
      - ${_MEMORY}
      - --cpu
      - ${_CPU}
      - --min-instances
      - ${_MIN_INSTANCES}
      - --max-instances
      - ${_MAX_INSTANCES}
      - --concurrency
      - ${_CONCURRENCY}
      - --timeout
      - ${_TIMEOUT}
      - --port
      - "8080"
      - --env-vars-file
      - /workspace/apps/api/.env.cloudrun.sit.yaml

images:
  - gcr.io/h-m-s-505410/hms-api-sit:$SHORT_SHA

substitutions:
  _PROJECT_ID: h-m-s-505410
  _REGION: asia-south1
  _SERVICE_NAME: hms-api-sit
  _MEMORY: 512Mi
  _CPU: "1"
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "3"
  _CONCURRENCY: "80"
  _TIMEOUT: 300s

options:
  logging: CLOUD_LOGGING_ONLY
